name: Module CI

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      label:
        required: true
        type: string
      go-mod:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  GOTESTSUM_VERSION: 1.12.0
  GOLANGCI_LINT_VERSION: v2.12.2

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-mod }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          only-new-issues: true
          working-directory: ${{ inputs.module }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-mod }}

      - name: Setup gotestsum
        uses: autero1/action-gotestsum@7263b9d73912eec65f46337689e59fac865c425f # v2.0.0
        with:
          gotestsum_version: ${{ env.GOTESTSUM_VERSION }}

      - name: Run tests
        working-directory: ${{ inputs.module }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/reports/${{ inputs.label }}
          gotestsum \
            --junitfile $GITHUB_WORKSPACE/reports/${{ inputs.label }}/unit-tests.xml \
            --jsonfile $GITHUB_WORKSPACE/reports/${{ inputs.label }}/unit-tests-results.json \
            -- -race -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/reports/${{ inputs.label }}/cover.txt \
            ./...

      - name: Generate test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests Report (${{ inputs.module }})
          path: "reports/${{ inputs.label }}/unit-tests-results.json"
          reporter: golang-json

      - name: Upload test report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: unit-test-report-${{ inputs.label }}
          path: reports/${{ inputs.label }}

      - name: Upload code coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/${{ inputs.label }}/cover.txt
          flags: ${{ inputs.label }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/${{ inputs.label }}/unit-tests.xml
